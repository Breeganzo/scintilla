name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Real PostgreSQL, not SQLite. The point of choosing Postgres is lost if
    # it is never actually exercised - and local development on a machine
    # without Docker cannot exercise it. CI can.
    services:
      postgres:
        # pgvector/pgvector, not plain postgres: the migrations create the
        # `vector` extension, which does not exist in the stock image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scintilla
          POSTGRES_PASSWORD: scintilla
          POSTGRES_DB: scintilla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scintilla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-real
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://scintilla:scintilla@localhost:5432/scintilla_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check for missing migrations
        # Fails if a model was changed without generating a migration. This is
        # a genuinely common mistake and it only surfaces at deploy time
        # otherwise.
        run: python manage.py makemigrations --check --dry-run

      - name: Check the committed API schema is current
        # schema.yaml is the contract the frontend generates its types from.
        # If a serializer changes and the schema is not regenerated, the
        # frontend keeps compiling against a shape the API no longer returns -
        # and nothing fails until a user sees an undefined field. Regenerating
        # here and diffing turns that into a red build.
        run: |
          python manage.py spectacular --file /tmp/schema.yaml
          diff -u schema.yaml /tmp/schema.yaml || {
            echo "::error::schema.yaml is stale. Run: python manage.py spectacular --file schema.yaml"
            exit 1
          }

      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `npm ci` rather than `npm install`: it installs exactly the lockfile
        # and fails if package.json and the lockfile disagree, so CI cannot
        # silently test a different dependency tree than the one committed.
        run: npm ci

      - name: Check the generated API types are current
        working-directory: frontend
        # The same argument as the schema check above, one link further down
        # the chain. schema.d.ts is generated, never edited; if someone edits
        # it by hand or forgets to regenerate it, this fails.
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run: npm run generate:api"
            exit 1
          }

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  regression:
    name: Retrieval regression gate
    runs-on: ubuntu-latest

    # The point of this job. Unit tests prove the pieces behave; this proves the
    # pipeline still *ranks* as well as it did. A chunker that silently starts
    # truncating, an embedding that stops being written, a fusion step that
    # loses its ordering - none of those necessarily break a test, and all of
    # them show up as a lower score against a fixed corpus.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scintilla
          POSTGRES_PASSWORD: scintilla
          POSTGRES_DB: scintilla_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scintilla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-real
      DJANGO_DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://scintilla:scintilla@localhost:5432/scintilla_regression

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Prepare the database
        run: python manage.py migrate --no-input

      - name: Check retrieval against the committed baseline
        # Rebuilds 340 papers from a fixture using the real chunker, the real
        # vector store and the real ranking path, then compares every gated
        # metric to evaluation/results/ci_baseline.json. Deterministic: two runs
        # of unchanged code produce identical scores, so a failure here is a
        # real change, not noise.
        run: python manage.py check_regression

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        # Runtime dependencies only: a vulnerability in a linter that never
        # runs in production is not the same risk as one in a web framework.
        run: pip-audit -r requirements/base.txt --strict

  build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        # Validates the Dockerfile on every push. Development happens on a
        # machine without Docker, so this job is the only thing standing
        # between a broken Dockerfile and a failed deployment.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: scintilla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts and Django is importable
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-only \
            -e DATABASE_URL=postgres://u:p@localhost:5432/db \
            scintilla:ci python -c "import django; print(django.get_version())"

  compose-validate:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet && echo "compose config is valid"
