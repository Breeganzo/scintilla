openapi: 3.0.3
info:
  title: Scintilla API
  version: 0.1.0
  description: Hybrid search and grounded question answering over scientific preprints.
paths:
  /api/evaluation-runs/:
    get:
      operationId: evaluation_runs_list
      description: Retrieval quality over time, per retriever mode.
      summary: List evaluation runs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - evaluation
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvaluationRunList'
          description: ''
  /api/evaluation-runs/{id}/:
    get:
      operationId: evaluation_runs_retrieve
      description: Retrieval quality over time, per retriever mode.
      summary: Retrieve one evaluation run
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this evaluation run.
        required: true
      tags:
      - evaluation
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Returns 200 when the service can reach its database, 503 otherwise.
        Used by the container health check and by uptime monitoring.
      summary: Liveness and readiness probe
      tags:
      - system
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '503':
          description: No response body
  /api/ingestion-runs/:
    get:
      operationId: ingestion_runs_list
      description: |-
        Harvest history.

        Exposed over HTTP so that pipeline health is observable without database
        access, which matters once this is running somewhere other than a laptop.
      summary: List ingestion runs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - operations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIngestionRunList'
          description: ''
  /api/ingestion-runs/{id}/:
    get:
      operationId: ingestion_runs_retrieve
      description: |-
        Harvest history.

        Exposed over HTTP so that pipeline health is observable without database
        access, which matters once this is running somewhere other than a laptop.
      summary: Retrieve one ingestion run
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ingestion run.
        required: true
      tags:
      - operations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRun'
          description: ''
  /api/papers/:
    get:
      operationId: papers_list
      description: Browse the indexed corpus.
      summary: List papers
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - papers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaperListList'
          description: ''
  /api/papers/{arxiv_id}/:
    get:
      operationId: papers_retrieve
      description: Browse the indexed corpus.
      summary: Retrieve one paper by arXiv ID
      parameters:
      - in: path
        name: arxiv_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - papers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
          description: ''
  /api/search/:
    post:
      operationId: search_create
      description: Retrieve papers by keyword (bm25), meaning (dense), or both fused
        with Reciprocal Rank Fusion (hybrid). The mode parameter is what makes the
        published ablation a measurement of this endpoint rather than of a parallel
        implementation.
      summary: Search the corpus
      tags:
      - search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
components:
  schemas:
    EvaluationRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        git_sha:
          type: string
          description: The commit these numbers came from. A metric that cannot be
            traced to a specific revision cannot be reproduced, and a number that
            cannot be reproduced should not be quoted.
          maxLength: 40
        golden_set_version:
          type: string
          description: Golden set file version. Comparing runs across different versions
            is invalid.
          maxLength: 32
        mode:
          $ref: '#/components/schemas/EvaluationRunModeEnum'
        num_queries:
          type: integer
          maximum: 2147483647
          minimum: 0
        metrics:
          description: 'Aggregate and per-class metrics: recall@k, MRR, nDCG@10. JSON
            rather than columns because the metric set is still changing, and a migration
            per new metric would discourage adding them.'
        is_baseline:
          type: boolean
          description: Marks the run the CI regression gate compares against
        notes:
          type: string
      required:
      - git_sha
      - golden_set_version
      - id
      - mode
      - num_queries
      - started_at
    EvaluationRunModeEnum:
      enum:
      - bm25
      - dense
      - hybrid
      type: string
      description: |-
        * `bm25` - BM25 keyword
        * `dense` - Dense vector
        * `hybrid` - Hybrid (RRF)
    IngestionRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        categories:
          description: arXiv categories requested for this run
        papers_seen:
          type: integer
          maximum: 2147483647
          minimum: 0
        papers_created:
          type: integer
          maximum: 2147483647
          minimum: 0
        papers_updated:
          type: integer
          maximum: 2147483647
          minimum: 0
        papers_skipped:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Content hash unchanged, so no work was needed
        papers_split:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Papers whose text exceeded the embedding model's context window
            and had to be sentence-split. Counted because the alternative is the model
            silently truncating them, which degrades retrieval for a subset of documents
            with nothing in any log to explain it.
        chunks_indexed:
          type: integer
          maximum: 2147483647
          minimum: 0
        watermark:
          type: string
          format: date-time
          nullable: true
          description: Newest publication date this run saw. The next run queries
            arXiv forward from here instead of re-scanning the whole category. Set
            only on a successful run - advancing it after a failure would skip everything
            the failed run never reached.
        triggered_by:
          type: string
          description: scheduler, manual, backfill, test
          maxLength: 64
        error_message:
          type: string
      required:
      - duration_seconds
      - id
      - started_at
    PaginatedEvaluationRunList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationRun'
    PaginatedIngestionRunList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/IngestionRun'
    PaginatedPaperListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PaperList'
    PaperDetail:
      type: object
      description: Full representation, including indexing state.
      properties:
        arxiv_id:
          type: string
          description: Canonical arXiv identifier with the version suffix stripped,
            e.g. 2401.12345. This is the paper's stable identity and what ingestion
            upserts on. Keying on the versioned form instead would make every revision
            look like a new paper and fill the corpus with duplicates.
          maxLength: 32
        version:
          type: integer
          maximum: 32767
          minimum: 0
          description: arXiv version number. 2401.12345v3 is stored as arxiv_id +
            version 3.
        title:
          type: string
        abstract:
          type: string
        authors: {}
        categories: {}
        primary_category:
          type: string
          maxLength: 32
        published_at:
          type: string
          format: date-time
          description: When the first version was submitted to arXiv
        arxiv_updated_at:
          type: string
          format: date-time
          description: When the most recent version was submitted
        abs_url:
          type: string
          format: uri
          maxLength: 500
        pdf_url:
          type: string
          format: uri
          maxLength: 500
        content_hash:
          type: string
          readOnly: true
          description: 'SHA-256 of title + abstract. Ingestion compares this before
            doing any work: an unchanged hash means the paper can be skipped without
            re-embedding it. This is what makes the pipeline safe to re-run.'
        indexed_at:
          type: string
          format: date-time
          nullable: true
          description: When this paper was last written to the search index. NULL
            means it exists in Postgres but is not yet searchable - the two stores
            can legitimately disagree mid-run, and this field records that.
        needs_indexing:
          type: boolean
          readOnly: true
        chunk_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - abs_url
      - abstract
      - arxiv_id
      - arxiv_updated_at
      - chunk_count
      - content_hash
      - created_at
      - needs_indexing
      - pdf_url
      - primary_category
      - published_at
      - title
      - updated_at
    PaperList:
      type: object
      description: Light representation for result lists.
      properties:
        arxiv_id:
          type: string
          description: Canonical arXiv identifier with the version suffix stripped,
            e.g. 2401.12345. This is the paper's stable identity and what ingestion
            upserts on. Keying on the versioned form instead would make every revision
            look like a new paper and fill the corpus with duplicates.
          maxLength: 32
        title:
          type: string
        authors: {}
        primary_category:
          type: string
          maxLength: 32
        categories: {}
        published_at:
          type: string
          format: date-time
          description: When the first version was submitted to arXiv
        abs_url:
          type: string
          format: uri
          maxLength: 500
        abstract_snippet:
          type: string
          description: First 300 characters, cut on a word boundary.
          readOnly: true
      required:
      - abs_url
      - abstract_snippet
      - arxiv_id
      - primary_category
      - published_at
      - title
    SearchRequestModeEnum:
      enum:
      - bm25
      - dense
      - hybrid
      type: string
      description: |-
        * `bm25` - bm25
        * `dense` - dense
        * `hybrid` - hybrid
    SearchRequestRequest:
      type: object
      description: What a client may ask for.
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language query.
          maxLength: 512
        mode:
          allOf:
          - $ref: '#/components/schemas/SearchRequestModeEnum'
          default: hybrid
          description: |-
            Retrieval strategy. Exposed because it is the ablation mechanism: the evaluation harness calls this endpoint once per mode, so the measured system is the served system.

            * `bm25` - bm25
            * `dense` - dense
            * `hybrid` - hybrid
        top_k:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          description: How many results to return.
      required:
      - query
    SearchResponse:
      type: object
      description: The envelope.
      properties:
        query:
          type: string
        mode:
          type: string
        top_k:
          type: integer
        count:
          type: integer
        took_ms:
          type: number
          format: double
        diagnostics:
          type: object
          additionalProperties: {}
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - count
      - diagnostics
      - mode
      - query
      - results
      - took_ms
      - top_k
    SearchResult:
      type: object
      description: One result, with the paper metadata needed to render it.
      properties:
        arxiv_id:
          type: string
        rank:
          type: integer
        score:
          type: number
          format: double
        title:
          type: string
        abstract:
          type: string
        authors:
          type: array
          items:
            type: string
        primary_category:
          type: string
        published_at:
          type: string
          format: date-time
        abs_url:
          type: string
          format: uri
        debug:
          type: object
          additionalProperties: {}
          description: Per-retriever rank and score detail. For hybrid, this shows
            which retrievers found the paper and what each contributed to its fused
            score - the data behind the 'why this result' panel, and the first thing
            to read when a ranking looks wrong.
      required:
      - abs_url
      - abstract
      - arxiv_id
      - authors
      - debug
      - primary_category
      - published_at
      - rank
      - score
      - title
    StatusEnum:
      enum:
      - running
      - success
      - failed
      - partial
      type: string
      description: |-
        * `running` - Running
        * `success` - Success
        * `failed` - Failed
        * `partial` - Partial
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
